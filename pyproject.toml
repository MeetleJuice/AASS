[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aass-runtime"
version = "1.2.0"
description = "Bounded dual-loop autonomous engineering runtime"
requires-python = ">=3.12"
dependencies = ["filelock>=4.2.1,<5", "httpx>=0.28,<1", "mcp>=1.26,<2", "playwright>=1.58,<2"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
aass = "orchestration_canvas:main"

[tool.setuptools]
py-modules = ["initialize_aass", "circuit_breaker", "worker_agent", "stall_detector", "judge_evaluator", "orchestration_canvas", "crdal_supervisor", "telemetry", "settings", "install_aass", "launch_aass", "local_app", "setup_api", "setup_controller", "setup_wizard"]

[tool.setuptools.packages.find]
include = ["tools*", "sandboxes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
