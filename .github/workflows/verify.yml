name: AASS verification and release
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'downloads/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: aass-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked developer dependencies and reviewed source
        run: |
          python -m venv .venv
      - name: Linux dependencies and integrations
        if: runner.os == 'Linux'
        run: |
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
          .venv/bin/python -m playwright install --with-deps chromium
          docker pull postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
          docker pull python:3.12-slim@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704
          AASS_INTEGRATION=1 AASS_POSTGRES_INTEGRATION=1 bash scripts/verify.sh
      - name: Windows hash-locked dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .venv/Scripts/python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          .venv/Scripts/python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { throw 'Project installation failed' }
      - name: Windows regression tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/run_windows_tests.py --python .venv/Scripts/python.exe --junitxml generated/windows-verification.xml
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            python scripts/report_test_failures.py generated/windows-verification.xml
            throw "Windows regression tests failed (exit $testExit)"
          }
      - name: Windows actual batch entry point
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AASS_PYTHON = (Get-Command python).Source
          cmd /d /c "Install-AASS.bat --help <NUL"
          if ($LASTEXITCODE -ne 0) { throw 'Batch entry point failed' }
      - name: Build deterministic source release
        if: runner.os == 'Windows'
        run: python scripts/package.py
      - name: Clean Windows runtime install and real Chromium check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clean = Join-Path $env:RUNNER_TEMP 'aass-clean-runtime'
          Expand-Archive -LiteralPath dist/AASS-1.3.0.zip -DestinationPath $clean
          $root = Join-Path $clean 'AASS-1.3.0'
          $managed = Join-Path $env:RUNNER_TEMP 'aass-managed-install'
          python (Join-Path $root 'desktop_bootstrap.py') --source $root --root $managed --offline --no-launch
          if ($LASTEXITCODE -ne 0) { throw 'Fresh managed source bootstrap failed' }
          python (Join-Path $managed 'verify_release.py') --root $managed
          if ($LASTEXITCODE -ne 0) { throw 'Managed source release verification failed' }
          python (Join-Path $managed 'setup_wizard.py') --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Managed setup window failed before dependencies were installed' }
          if (Test-Path (Join-Path $managed '.venv')) { throw 'Bootstrap unexpectedly relocated or created a runtime' }
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $root '.aass/browsers'
          python (Join-Path $root 'launch_aass.py') --install-only
          if ($LASTEXITCODE -ne 0) { throw 'Clean end-user runtime installation failed' }
          $runtime = Join-Path $root '.venv/Scripts/python.exe'
          & $runtime -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Clean runtime dependencies are inconsistent' }
          & $runtime (Join-Path $root 'setup_wizard.py') --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Clean Windows guided setup window failed' }
          $desktop = Join-Path $root '.aass/verification-desktop'
          $shortcutProbe = @'
          import ctypes
          import sys
          from pathlib import Path
          import win32com.client
          from desktop_integration import create_shortcut
          root, desktop = (Path(value).resolve() for value in sys.argv[1:3])
          link = create_shortcut(root, desktop=desktop)
          shortcut = win32com.client.Dispatch('WScript.Shell').CreateShortcut(str(link))
          expected_target = Path(sys._base_executable).with_name('pythonw.exe').resolve()
          assert Path(shortcut.TargetPath).resolve() == expected_target
          assert Path(shortcut.WorkingDirectory).resolve() == root
          assert str(root / 'desktop_launcher.py') in shortcut.Arguments
          assert '--root' in shortcut.Arguments
          assert Path(shortcut.IconLocation.rsplit(',', 1)[0].strip('"')).resolve() == root / 'assets/aass.ico'
          user32 = ctypes.WinDLL('user32', use_last_error=True)
          user32.LoadImageW.argtypes = [ctypes.c_void_p, ctypes.c_wchar_p, ctypes.c_uint, ctypes.c_int, ctypes.c_int, ctypes.c_uint]
          user32.LoadImageW.restype = ctypes.c_void_p
          user32.DestroyIcon.argtypes = [ctypes.c_void_p]
          user32.DestroyIcon.restype = ctypes.c_int
          icon = user32.LoadImageW(None, str(root / 'assets/aass.ico'), 1, 32, 32, 0x10)
          assert icon, 'Windows could not decode the custom ICO resource'
          assert user32.DestroyIcon(icon)
          assert create_shortcut(root, desktop=desktop) == link
          print('Clean Windows custom-icon shortcut created and inspected without touching the real Desktop')
          '@
          & $runtime -c $shortcutProbe $root $desktop
          if ($LASTEXITCODE -ne 0) { throw 'Clean Windows desktop shortcut verification failed' }
          $probe = "import os, mcp, httpx, filelock, win32api; os.environ['AASS_JUDGE_API_KEY']='fixture-not-real'; from orchestration_canvas import doctor; result=doctor(); assert result['checks']['chromium']['ready'], result; print('Clean Windows runtime, isolated browser helper and Chromium verified')"
          & $runtime -c $probe
          if ($LASTEXITCODE -ne 0) { throw 'Clean Windows runtime/browser verification failed' }
          python (Join-Path $root 'verify_release.py') --root $root
          if ($LASTEXITCODE -ne 0) { throw 'Release sources changed during installation' }
          Add-Content -Path $env:GITHUB_ENV -Value "AASS_SCAN_PAYLOAD=$root"
          Add-Content -Path $env:GITHUB_ENV -Value "PLAYWRIGHT_BROWSERS_PATH=$env:PLAYWRIGHT_BROWSERS_PATH"
      - name: Scan exact archive and extracted payload with Microsoft Defender
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/scan_release.ps1 -Archive dist/AASS-1.3.0.zip -PayloadPath "$env:AASS_SCAN_PAYLOAD"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: runner.os == 'Windows'
        with:
          name: windows-scanned-source
          path: |
            dist/AASS-1.3.0.zip
            dist/SHA256SUMS
            dist/defender-scan.json
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-audit.lock
          mkdir -p dist
          python scripts/audit_dependencies.py requirements.lock --output dist/dependency-audit.json
          python scripts/audit_dependencies.py requirements-dev.lock --output dist/dev-dependency-audit.json
          python scripts/audit_dependencies.py requirements-audit.lock --output dist/tool-dependency-audit.json
          python scripts/audit_dependencies.py requirements.lock --format cyclonedx-json --output dist/SBOM.json
          python -m bandit -r . -x ./.venv,./tests,./.aass,./build,./dist -ll -f json -o dist/source-security.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: security-evidence
          path: dist/*.json
  publish:
    needs: [verify, security]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: '*-source'
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: security-evidence
          path: dist
      - name: Verify exact artifact, manifest and matching scan before publication
        run: |
          python scripts/check_release_evidence.py dist
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/AASS-1.3.0.zip
      - name: Publish verified source and evidence together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.3.0-${GITHUB_SHA::7}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "AASS 1.3.0 (${GITHUB_SHA::7})" --notes-file docs/RELEASE-NOTES.md --latest dist/AASS-1.3.0.zip dist/SHA256SUMS dist/defender-scan.json dist/dependency-audit.json dist/source-security.json dist/SBOM.json
