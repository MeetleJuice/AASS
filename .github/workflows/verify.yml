name: AASS verification and release
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'downloads/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: aass-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install hash-locked developer dependencies and reviewed source
        run: |
          python -m venv .venv
      - name: Linux dependencies and integrations
        if: runner.os == 'Linux'
        run: |
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
          .venv/bin/python -m playwright install --with-deps chromium
          docker pull postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
          docker pull python:3.12-slim@sha256:a0f57064cbdcd6285fa45f51237ab0b35ea8ebaed06a1f5973e89e19dfb86704
          AASS_INTEGRATION=1 AASS_POSTGRES_INTEGRATION=1 bash scripts/verify.sh
      - name: Windows hash-locked dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .venv/Scripts/python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          .venv/Scripts/python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { throw 'Project installation failed' }
      - name: Windows regression tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .venv/Scripts/python -m pytest -q --junitxml=generated/windows-verification.xml
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            python scripts/report_test_failures.py generated/windows-verification.xml
            throw "Windows regression tests failed (exit $testExit)"
          }
      - name: Windows actual batch entry point
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AASS_PYTHON = (Get-Command python).Source
          cmd /d /c "Install-AASS.bat --help <NUL"
          if ($LASTEXITCODE -ne 0) { throw 'Batch entry point failed' }
      - name: Build deterministic source release
        if: runner.os == 'Windows'
        run: python scripts/package.py
      - name: Scan exact archive and extracted payload with Microsoft Defender
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/scan_release.ps1 -Archive dist/AASS-1.1.0.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: windows-scanned-source
          path: |
            dist/AASS-1.1.0.zip
            dist/SHA256SUMS
            dist/defender-scan.json
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-audit.lock
          mkdir -p dist
          python -m pip_audit -r requirements.lock --disable-pip --no-deps -f json -o dist/dependency-audit.json
          python -m pip_audit -r requirements-dev.lock --disable-pip --no-deps
          python -m pip_audit -r requirements-audit.lock --disable-pip --no-deps
          python -m pip_audit -r requirements.lock --disable-pip --no-deps -f cyclonedx-json -o dist/SBOM.json
          python -m bandit -r . -x ./.venv,./tests,./.aass,./build,./dist -ll -f json -o dist/source-security.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-evidence
          path: dist/*.json
  publish:
    needs: [verify, security]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-source'
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: security-evidence
          path: dist
      - name: Verify exact artifact, manifest and matching scan before publication
        run: |
          python scripts/check_release_evidence.py dist
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/AASS-1.1.0.zip
      - name: Publish verified source and evidence together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.1.0-${GITHUB_SHA::7}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "AASS 1.1.0 (${GITHUB_SHA::7})" --notes-file docs/RELEASE-NOTES.md --latest dist/AASS-1.1.0.zip dist/SHA256SUMS dist/defender-scan.json dist/dependency-audit.json dist/source-security.json dist/SBOM.json
